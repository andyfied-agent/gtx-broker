[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtx-broker"
version = "0.1.0"
description = "Deterministic task scoping, routing, and escalation controller"
requires-python = ">=3.10"
dependencies = ["python-magic"]

[tool.setuptools]
packages = ["gtx_broker", "gtx_broker.scheduler", "second_shift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
