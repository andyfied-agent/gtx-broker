# P40 Profile Configuration
# System-wide profiles for llama-qwen35.service
# Each profile defines the model, quantization, projector, and runtime settings

profiles:
  qwen35-coding:
    description: "Qwen3.5 coding model for text/code tasks"
    model_family: qwen3.5
    role: coding
    quantization: Q3_K_XL
    gguf_path: /mnt/scratch/models/qwen3.5/Qwen3.5-35B-A3B-UD-Q3_K_XL.gguf
    expected_model_id: "qwen3.5-35b-ud-q3_k_xl"
    expected_gguf_hash: "sha256:<HASH_TO_BE_FILLED_AT_DEPLOY_TIME>"
    projector: null
    gpu_layers: 99
    context_size: 262144
    chat_template: qwen3.5
    slots: 4

  qwen35-vision:
    description: "Qwen3.5 vision model with BF16 projector for image tasks"
    model_family: qwen3.5
    role: vision
    quantization: Q2_K
    gguf_path: /mnt/scratch/models/qwen3.5/Qwen3.5-35B-A3B-Vision-Q2_K.gguf
    expected_model_id: "qwen3.5-35b-vision-q2_k"
    expected_gguf_hash: "sha256:<HASH_TO_BE_FILLED_AT_DEPLOY_TIME>"
    projector_path: /mnt/scratch/models/qwen3.5/qwen3.5-vision-bf16.mmproj
    projector_type: bf16
    gpu_layers: 99
    context_size: 262144
    chat_template: qwen3.5-vision
    slots: 4

  qwen36-vision:
    description: "Qwen3.6 vision model with BF16 projector for image tasks"
    model_family: qwen3.6
    role: vision
    quantization: Q2_K
    gguf_path: /mnt/scratch/models/qwen3.6/Qwen3.6-35B-A3B-Vision-Q2_K.gguf
    expected_model_id: "qwen3.6-35b-vision-q2_k"
    expected_gguf_hash: "sha256:<HASH_TO_BE_FILLED_AT_DEPLOY_TIME>"
    projector_path: /mnt/scratch/models/qwen3.6/qwen3.6-vision-bf16.mmproj
    projector_type: bf16
    gpu_layers: 99
    context_size: 262144
    chat_template: qwen3.6-vision
    slots: 4

# Deployment notes:
# - Fill in expected_gguf_hash with actual SHA256 after deploying model files
# - Run: sha256sum /path/to/model.gguf
# - Verify hashes during deployment, not at runtime
